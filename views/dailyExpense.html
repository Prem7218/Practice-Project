<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Day to Day Expense</title>
	<style>
		:root {
			color-scheme: light;
			--ink: #1d2939;
			--muted: #667085;
			--line: #e4e7ec;
			--accent: #635bff;
			--surface: #ffffff;
			--background: #f5f7fb;
		}
		* { box-sizing: border-box; }
		body {
			margin: 0;
			background: var(--background);
			color: var(--ink);
			font: 15px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
		}
		.page { width: min(1120px, calc(100% - 36px)); margin: 32px auto 56px; }
		.topbar { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; margin-bottom: 28px; }
		.clock { color: var(--muted); font-size: 13px; }
		.clock strong { display: block; color: var(--ink); font-size: 15px; font-weight: 600; }
		h1 { margin: 0; font-size: clamp(26px, 4vw, 34px); letter-spacing: -0.04em; }
		.current-period { margin-top: 20px; color: var(--muted); }
		.current-period strong { display: block; color: var(--ink); font-size: 20px; }
		.card { margin-top: 20px; padding: 22px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 4px 16px rgba(16, 24, 40, .035); }
		.section-heading { margin: 0 0 16px; font-size: 18px; letter-spacing: -0.02em; }
		.section-heading small { color: var(--muted); font-size: 13px; font-weight: 500; }
		.table-wrap { overflow-x: auto; }
		table { width: 100%; border-collapse: collapse; text-align: left; }
		th, td { padding: 12px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
		th { color: var(--muted); background: #f9fafb; font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
		td { color: #344054; }
		tbody tr:last-child td { border-bottom: 0; }
		.empty-row td { height: 54px; color: #98a2b3; text-align: center; }
		.money { text-align: right; }
		.report-download {
			position: fixed;
			right: 24px;
			bottom: 24px;
			z-index: 10;
			padding: 12px 18px;
			border: 0;
			border-radius: 8px;
			background: var(--accent);
			color: #fff;
			font: inherit;
			font-weight: 600;
			cursor: pointer;
			box-shadow: 0 4px 12px rgba(16, 24, 40, .2);
		}
		.report-download:hover { background: #5148e5; }
		@media print {
			.report-download { display: none; }
			.page { width: 100%; margin: 0; }
			.card { break-inside: avoid; box-shadow: none; }
		}
		@media (max-width: 600px) {
			.page { width: min(100% - 24px, 1120px); margin-top: 22px; }
			.card { padding: 16px 12px; }
			th, td { padding: 11px 10px; }
		}
	</style>
</head>
<body>
	<main class="page">
		<header>
			<div class="topbar">
				<div class="clock" aria-live="polite">
					<strong id="current-date">--</strong>
					<span id="current-time">--</span>
				</div>
				<h1>Day to Day Expense</h1>
			</div>
			<div class="current-period">Current month and year<strong id="current-month">--</strong></div>
		</header>

		<section class="card" aria-labelledby="daily-title">
			<h2 class="section-heading" id="daily-title">Daily Expenses</h2>
			<div class="table-wrap">
				<table>
					<thead><tr><th>Date</th><th>Description</th><th>Category</th><th class="money">Income</th><th class="money">Expense</th></tr></thead>
					<tbody><tr class="empty-row"><td colspan="5">No daily transactions yet</td></tr></tbody>
				</table>
			</div>
		</section>

		<section class="card" aria-labelledby="yearly-title">
			<h2 class="section-heading" id="yearly-title">Yearly Report <small id="report-year"></small></h2>
			<div class="table-wrap">
				<table>
					<thead><tr><th>Month</th><th class="money">Income</th><th class="money">Expense</th><th class="money">Savings</th></tr></thead>
					<tbody><tr class="empty-row"><td colspan="4">No yearly report data yet</td></tr></tbody>
				</table>
			</div>
		</section>

		<section class="card" aria-labelledby="notes-title">
			<h2 class="section-heading" id="notes-title">Notes Report <small id="notes-year"></small></h2>
			<div class="table-wrap">
				<table>
					<thead><tr><th>Date</th><th>Notes</th></tr></thead>
					<tbody><tr class="empty-row"><td colspan="2">No notes for this year yet</td></tr></tbody>
				</table>
			</div>
		</section>
	</main>
	<button class="report-download" type="button" onclick="window.print()">Download Report</button>
	<script>
		function updateClock() {
			const now = new Date();
			document.getElementById('current-date').textContent = now.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
			document.getElementById('current-time').textContent = now.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit', second: '2-digit' });
			document.getElementById('current-month').textContent = now.toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
			document.getElementById('report-year').textContent = `(${now.getFullYear()})`;
			document.getElementById('notes-year').textContent = `(${now.getFullYear()})`;
		}
		updateClock();
		setInterval(updateClock, 1000);
	</script>
</body>
</html>
