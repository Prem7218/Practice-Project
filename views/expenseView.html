<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Expense</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: #f3f6fb;
            color: #1f2937;
            font-family: Arial, sans-serif;
        }

        .expense-card {
            width: min(100%, 480px);
            padding: 32px;
            border-radius: 12px;
            background: #fff;
            box-shadow: 0 8px 24px rgba(31, 41, 55, 0.1);
        }

        h1 {
            margin: 0 0 8px;
            font-size: 1.75rem;
        }

        .intro {
            margin: 0 0 24px;
            color: #6b7280;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font: inherit;
        }

        textarea {
            min-height: 96px;
            resize: vertical;
        }

        input:focus,
        textarea:focus,
        select:focus {
            outline: 2px solid #bfdbfe;
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 12px;
            border: 0;
            border-radius: 6px;
            background: #2563eb;
            color: #fff;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        /* Expense List */
        #output {
            list-style: none;
            padding: 0;
            margin: 25px 0 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Individual List Item */
        .web-link {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 12px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            background: #f9fafb;
        }

        .web-link p {
            margin: 0;
            margin-right: auto;
        }

        /* Common Button Styling */
        .web-link button {
            width: auto;
            padding: 8px 14px;
            border: none;
            border-radius: 5px;
            color: white;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        /* Delete Button */
        .delete-bookmark {
            background: #dc2626;
        }

        .delete-bookmark:hover {
            background: #b91c1c;
        }

        /* Edit Button */
        .edit-bookmark {
            background: #f59e0b;
        }

        .edit-bookmark:hover {
            background: #d97706;
        }


        /* Main Dashboard */
        .expense-card {
            width: min(100%, 1100px);
            padding: 30px;
        }

        /* Header */
        .page-header {
            margin-bottom: 25px;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 16px;
        }

        .page-header h1 {
            margin-bottom: 8px;
        }

        .logout-button {
            width: auto;
            flex-shrink: 0;
            padding: 9px 16px;
            background: #4b5563;
        }

        .logout-button:hover {
            background: #374151;
        }

        /* Two Column Layout */
        .dashboard-layout {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 25px;
            align-items: start;
        }

        /* Left Sidebar */
        .left-side {
            padding: 20px;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            background: #f9fafb;
        }

        .left-side h2,
        .right-side h2,
        .expense-list-section h2 {
            margin: 0 0 8px;
            font-size: 1.2rem;
        }

        .sidebar-intro {
            margin: 0 0 18px;
            font-size: 13px;
            color: #6b7280;
        }

        /* Users List */
        #users {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .user-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
        }

        .user-avatar {
            width: 38px;
            height: 38px;
            flex-shrink: 0;
            display: grid;
            place-items: center;
            border-radius: 50%;
            background: #dbeafe;
            color: #1d4ed8;
            font-weight: 700;
        }

        .user-details {
            min-width: 0;
            flex: 1;
        }

        .user-details p {
            margin: 0;
            overflow-wrap: anywhere;
        }

        .user-name {
            font-size: 14px;
            font-weight: 600;
        }

        .user-total {
            margin-top: 5px !important;
            font-size: 12px;
            color: #6b7280;
        }

        /* Right Side Form */
        .right-side {
            padding: 25px;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            background: white;
        }

        .right-side .intro {
            margin-bottom: 22px;
        }

        /* Expense List Section */
        .expense-list-section {
            margin-top: 30px;
            padding-top: 25px;
            border-top: 1px solid #e5e7eb;
        }

        /* Responsive Design */
        @media (max-width: 700px) {
            .page-header {
                align-items: center;
            }

            .dashboard-layout {
                grid-template-columns: 1fr;
            }

            .expense-card {
                padding: 20px;
            }
        }

        #pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin: 25px 0;
        }

        #pagination button {
            padding: 9px 16px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            cursor: pointer;
        }

        #pagination button:hover:not(:disabled) {
            background: #1d4ed8;
        }

        #pagination button:disabled {
            background: #aaa;
            cursor: not-allowed;
        }

        #pagination span {
            font-weight: 600;
        }
    </style>
</head>
<body>
    <main class="expense-card">
        <header class="page-header">
            <div>
                <h1>Expense Dashboard</h1>
                <p class="intro">Manage expenses and track user spending.</p>
            </div>
            <button class="logout-button" id="logoutBtn" type="button">Logout</button>
        </header>

        <div class="dashboard-layout">

            <!-- Left Side: Users List -->
            <aside class="left-side">
                <h2>Top Spenders</h2>
                <p class="sidebar-intro">Users ranked by total expenses</p>

                <ul id="users">
                    <!-- Users will be dynamically added here -->
                </ul>
            </aside>

            <!-- Right Side: Expense Form -->
            <section class="right-side">
                <h2>Add an Expense</h2>
                <p class="intro">Enter your expense details below.</p>

                <form id="form">

                    <div class="form-group">
                        <label for="expense">Expense amount</label>
                        <input
                            type="number"
                            id="expense"
                            name="expense"
                            min="0.01"
                            step="0.01"
                            placeholder="0.00"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="description">Description</label>
                        <textarea
                            id="description"
                            name="description"
                            placeholder="What was this expense for?"
                            required
                        ></textarea>
                    </div>

                    <div class="form-group">
                        <label for="category">Category</label>
                        <select id="category" name="category" required>
                            <option value="" disabled selected>Select a category</option>
                            <option value="food">Food</option>
                            <option value="transport">Transportation</option>
                            <option value="housing">Housing</option>
                            <option value="utilities">Utilities</option>
                            <option value="health">Health</option>
                            <option value="entertainment">Entertainment</option>
                            <option value="other">Other</option>
                        </select>
                    </div>

                    <p id="message"></p>

                    <button id="submitBtn" type="submit">
                        Add Expense
                    </button>

                </form>
            </section>

        </div>

        <!-- Expense List -->
        <section class="expense-list-section">
            <h2>Recent Expenses</h2>
            <ul id="output"></ul>
            <div id="pagination"></div>
        </section>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.20.0/axios.min.js" integrity="sha512-OVq+Gfa9PIjbTC0jWOccSFSp/vzkBQ5pMcbHQrNZLl+izmdFmusmAMlX4LT550ivvSnMXMEeG7CxEtjIz6Dn2Q==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="/js/expense.js"></script>
</body>
</html>
