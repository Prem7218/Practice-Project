<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forget Password</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            background: #f3f4f6;
            color: #1f2937;
            font-family: Arial, sans-serif;
        }

        .password-card {
            width: min(100%, 400px);
            padding: 32px;
            border-radius: 12px;
            background: #fff;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin: 0 0 8px;
            font-size: 1.75rem;
        }

        .description {
            margin: 0 0 24px;
            color: #6b7280;
            line-height: 1.5;
        }

        label {
            display: block;
            margin: 16px 0 8px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font: inherit;
        }

        input:focus {
            outline: 2px solid #2563eb;
            outline-offset: 2px;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 12px;
            border: 0;
            border-radius: 6px;
            background: #2563eb;
            color: #fff;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }
    </style>
</head>
<body>
    <main class="password-card">
        <h1>Forget Password</h1>
        <p class="description">Enter and confirm your new password below.</p>
        <form id="form">
            <label for="email">Enter Registerd Email: </label>
            <input id="email" name="email" type="email" autocomplete="email" required>

            <label for="new-password">New password</label>
            <input id="new-password" name="newPassword" type="password" autocomplete="new-password" required>

            <label for="confirm-password">Confirm password</label>
            <input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" required>

            <center><span id="output" style="position: relative; top: 8px;"></span></center>
            <button type="submit">Update Password</button>
        </form>

        <button type="button" onclick="window.location.href = 'http://localhost:5000'">Go to Home</button>
    </main>
    
	<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>

        const form = document.getElementById('form');
            
        const newPass = document.getElementById('new-password');
        const conPass = document.getElementById('confirm-password');
        const email = document.getElementById('email');
        const p = document.getElementById('output');

        const id = window.location.pathname.split('/').pop();

        const host = 'http://localhost:5000';

        form.addEventListener('submit',async (e) => {
            e.preventDefault();

            try {
                if(newPass.value !== conPass.value) {
                    alert("Both password didn't match");
                    return;
                }

                const mail = await axios.put(`${host}/update/${id}`, {
                    updatedPassword: newPass.value,
                    email: email.value,
                });

                p.textContent = mail.data.message;

                if (!mail.data.status) {
                    p.style.color = 'red';
                    return;
                }

                p.style.color = 'green';

                alert('Password Updated Successfully!');
                window.location.href = `${host}`;

            } catch(error) {
                console.log(error);

                p.textContent =
                    error.response?.data?.message || error.message;

                p.style.color = 'red';
            }
        });
    </script>
</body>
</html>
