<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Password Forget Email</title>
	<style>
		* { box-sizing: border-box; }
		body {
			margin: 0;
			min-height: 100vh;
			display: grid;
			place-items: center;
			padding: 24px;
			background: #f3f4f6;
			color: #1f2937;
			font-family: Arial, sans-serif;
		}
		main {
			width: 100%;
			max-width: 420px;
			padding: 32px;
			border-radius: 12px;
			background: #fff;
			box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
		}
		h1 { margin: 0 0 10px; font-size: 24px; }
		p { margin: 0 0 24px; color: #6b7280; line-height: 1.5; }
		label { display: block; margin-bottom: 8px; font-weight: 600; }
		input {
			width: 100%;
			padding: 12px;
			margin-bottom: 16px;
			border: 1px solid #d1d5db;
			border-radius: 6px;
			font: inherit;
		}
		input:focus { outline: 2px solid #2563eb; border-color: transparent; }
		button {
			width: 100%;
			padding: 12px;
			border: 0;
			border-radius: 6px;
			background: #2563eb;
			color: #fff;
			font: inherit;
			font-weight: 600;
			cursor: pointer;
		}
		button:hover { background: #1d4ed8; }
	</style>
</head>
<body>
	<main>
		<h1>Password Forgot</h1>

		<p>
			Enter your email address and we'll send you
			a password reset link.
		</p>

		<form id="forgetForm">

			<label for="email">Email address</label>

			<input
				type="email"
				id="email"
				name="email"
				placeholder="you@example.com"
				autocomplete="email"
				required
			>

			<button id="submitBtn" type="submit">
				Send Mail
			</button>

			<center><p id="message"></p></center>

		</form>

		<button type="button" onclick="window.location.href ='http://localhost:5000'">Go to Home</button>
	</main>

	<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
	<script>

		const form = document.getElementById('forgetForm');
		const send = document.getElementById('submitBtn');
		const message = document.getElementById('message');

		form.addEventListener('submit', async (e) => {

			e.preventDefault();

			const email = document.getElementById('email').value.trim();

			try {
				
				send.disabled = true;
				send.textContent = 'Sending...';

				message.textContent = '';

				await axios.post('/mail', { email });
				
				message.textContent = 'Check your email for the password reset link!';
				message.style.color = 'green';

				send.textContent = 'Send Mail';
				form.reset();

			} catch (error) {
				message.textContent = error.message;
				message.style.color = 'red';

			} finally {
				send.disabled = false;
				send.textContent = 'Send Mail';
			}
		});

	</script>
</body>
</html>
