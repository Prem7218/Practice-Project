
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeWheelr Social Media</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            color: #1f2937;
            padding: 25px 15px;
        }

        .container {
            max-width: 750px;
            margin: auto;
        }

        h1 {
            text-align: center;
            color: #2563eb;
            margin-bottom: 25px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.07);
        }

        h2 {
            margin-bottom: 15px;
            font-size: 20px;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 15px;
            outline: none;
        }

        input:focus, textarea:focus {
            border-color: #2563eb;
        }

        textarea {
            resize: vertical;
            min-height: 75px;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 11px 18px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .post {
            background: white;
            border-radius: 12px;
            margin-bottom: 22px;
            overflow: hidden;
            box-shadow: 0 3px 12px rgba(0,0,0,0.07);
        }

        .post img {
            width: 100%;
            max-height: 450px;
            object-fit: cover;
            display: block;
            background: #e5e7eb;
        }

        .post-content {
            padding: 18px;
        }

        .post-content p {
            margin: 12px 0;
            line-height: 1.6;
            overflow-wrap: anywhere;
        }

        .post-id {
            color: #6b7280;
            font-size: 12px;
        }

        .message {
            padding: 12px;
            border-radius: 7px;
            margin-bottom: 15px;
            display: none;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        .empty {
            text-align: center;
            padding: 35px;
            background: white;
            border-radius: 10px;
            color: #6b7280;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        #refreshBtn {
            background: #374151;
        }

        @media(max-width: 500px) {
            .section-header {
                align-items: flex-start;
                gap: 10px;
            }
        }
    </style>
</head>

<body>
    <div class="container">

        <h1>CodeWheelr Social Media</h1>

        <!-- Create Post -->
        <div class="card">
            <h2>Create New Post</h2>
            <div id="message" class="message"></div>

            <form id="postForm">

                <input
                    type="url"
                    id="imgUrl"
                    placeholder="Enter Image URL"
                    required
                >

                <textarea
                    id="imgDisc"
                    placeholder="What's on your mind?"
                    required
                ></textarea>

                <button type="submit" id="submitBtn">
                    Create Post
                </button>

            </form>
        </div>

        <!-- All Posts -->
        <div class="card">

            <div class="section-header">
                <h2>All Posts</h2>

                <button id="refreshBtn" type="button">
                    Refresh
                </button>
            </div>

            <div id="postsContainer">
                <div class="empty">Loading posts...</div>
            </div>
        </div>
    </div>

    <script src="/js/social.js"></script>
</body>
</html>
