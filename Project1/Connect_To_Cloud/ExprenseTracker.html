<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <title>Document</title>
</head>
<body>
    <h1 class="text-center">Expense Tracker</h1>
    <div id="details" class="m-2 row">
        <div class="col-3">
            <label for="expense">Choose expense: </label>
            <input type="number" id="expense" class="form-control" />
        </div>

        <div class="col-4">
            <label for="search">Choose description:</label>
            <div class="searchable-dropdown dropdown">
                <input 
                    width="auto"
                    id="search" 
                    value="sads"
                    type="text" 
                    autocomplete="off"
                    class="form-control"
                    data-bs-toggle="dropdown"
                />

                <ul class="dropdown-menu mt-1" id="dropdownMenu">
                    <li><button class="dropdown-item" type="button">sads</button></li>
                    <li><button class="dropdown-item" type="button">Petrol</button></li>
                    <li><button class="dropdown-item" type="button">On Vacation</button> </li>
                    <li><button class="dropdown-item" type="button">disel</button></li>
                    <li><button class="dropdown-item" type="button">hello</button></li>
                    <li><button class="dropdown-item" type="button">1233</button></li>
                </ul>
            </div>
        </div>

        <div class="col-3">
            <label for="categorySelect">Category: </label>
            <select id="categorySelect" class="form-select">
                <option>fuel</option>
                <option>food</option>
                <option>electricity</option>
                <option>movie</option>
            </select>
        </div>

        <div class="col-2">
            <button class="see mt-2" onclick="expense()">Add Expense</button>
        </div>
    </div>

    <ul class="output"></ul>
    <p id="error" class="mx-auto text-center"></p>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.20.0/axios.min.js" integrity="sha512-OVq+Gfa9PIjbTC0jWOccSFSp/vzkBQ5pMcbHQrNZLl+izmdFmusmAMlX4LT550ivvSnMXMEeG7CxEtjIz6Dn2Q==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="app.js"></script>
</body>
</html>
