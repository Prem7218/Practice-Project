<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Bookmark adder</title>
    <style>
        body { min-height: 100vh; background: linear-gradient(145deg, #f3f6ff, #f8fafc 55%, #eef8f5); }
        .brand-mark { width: 2.75rem; height: 2.75rem; display: inline-grid; place-items: center; border-radius: .85rem; background: #e9edff; color: #4f46e5; }
        .bookmark-card { border: 1px solid rgba(15, 23, 42, .07); border-radius: 1rem; box-shadow: 0 1rem 3rem rgba(31, 41, 55, .08); }
    </style>
</head>
<body>
    <main class="container py-5">
        <div class="row justify-content-center"> 
            <section class="card bookmark-card bg-white">
                <div class="card-body p-4 p-md-5">
                    <p class="text-secondary small">Add a name and the website address to get started.</p>
                    <form onsubmit="handleFormSubmit(event)">
                        <div class="mb-3">
                            <label for="web" class="form-label fw-medium">Website name</label>
                            <input id="web" type="text" class="form-control form-control-lg" placeholder="e.g. My favorite blog" required>
                        </div>
                        <div class="mb-4">
                            <label for="link" class="form-label fw-medium">Website URL</label>
                            <input id="link" type="url" class="form-control form-control-lg" placeholder="https://example.com" required>
                        </div>
                        <button id="bkWeb" type="submit" class="btn btn-primary btn-lg w-100">＋ &nbsp; Save bookmark</button>
                    </form>
                </div>
            </section>

            <section class="mt-3">
                <div class="d-flex align-items-center justify-content-between mb-3">
                    <h2 id="saved-heading" class="h5 fw-semibold mb-0">Your bookmarks</h2>
                    <span class="small text-secondary">Saved links</span>
                </div>
                <ul id="output" class="list-group shadow-sm rounded-3"></ul>
            </section>
        </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.20.0/axios.min.js" integrity="sha512-OVq+Gfa9PIjbTC0jWOccSFSp/vzkBQ5pMcbHQrNZLl+izmdFmusmAMlX4LT550ivvSnMXMEeG7CxEtjIz6Dn2Q==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="app.js"></script>
</body>
</html>
