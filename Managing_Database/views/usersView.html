
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #1e293b;
        }

        .form-container {
            width: 100%;
            max-width: 420px;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.08);
        }

        .form-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .form-header h2 {
            font-size: 25px;
            margin-bottom: 8px;
            color: #0f172a;
        }

        .form-header p {
            font-size: 14px;
            color: #64748b;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            outline: none;
            font-size: 15px;
            transition: 0.2s;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        button {
            padding: 11px 18px;
            border: none;
            border-radius: 7px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            transform: translateY(-1px);
            opacity: 0.9;
        }

        #submitBtn {
            width: 100%;
            background: #2563eb;
            color: white;
            margin-bottom: 20px;
        }

        .navigation {
            display: flex;
            gap: 12px;
        }

        .navigation button {
            flex: 1;
            background: #e2e8f0;
            color: #334155;
        }

        .navigation button:hover {
            background: #cbd5e1;
        }

        @media (max-width: 480px) {
            .form-container {
                padding: 22px;
            }
        }
    </style>
</head>

<body>

    <div class="form-container">

        <div class="form-header">
            <h2>User Management</h2>
            <p>Add and manage user information</p>
        </div>

        <form onsubmit="handleSubmit(event)">

            <div class="form-group">
                <label for="userId">User ID</label>
                <input
                    id="userId"
                    type="number"
                    placeholder="Enter user ID"
                />
            </div>

            <div class="form-group">
                <label for="userName">Username</label>
                <input
                    id="userName"
                    type="text"
                    placeholder="Enter username"
                />
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input
                    id="email"
                    type="email"
                    placeholder="Enter email address"
                />
            </div>

            <button id="submitBtn" type="submit">
                Add User
            </button>

            <div class="navigation">
                <button id="prev" type="button">
                    ← Previous
                </button>

                <button id="next" type="button">
                    Next →
                </button>
            </div>

        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="/js/users.js"></script>
</body>
</html>
