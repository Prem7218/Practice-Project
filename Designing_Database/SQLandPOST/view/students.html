<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students</title>
</head>
<body>
    <main id="details">
        <h1 id="title">Student Details</h1>
        <form id="form" onsubmit="handleFormSubmit(event)">
            <div id="name">
                <label id="student-name-label" for="student-name">Student name</label>
                <input type="text" id="student-name" name="student_name" required>
            </div>

            <div id="email">
                <label id="student-email-label" for="student-email">Student email</label>
                <input type="email" id="student-email" name="student_email" required>
            </div>

            <div id="student-id-field" hidden>
                <label id="student-id-label" for="student-id">Student ID</label>
                <input type="number" min="1" id="student-id" name="student_id">
            </div>

            <button id="add-student-button" type="submit">Add</button>
            <button id="update-student-button" type="button" hidden>Update details</button>
            <button id="next-step-button" type="button" onclick="showUpdateForm()">Next</button>
            <button id="previous-step-button" type="button" onclick="showAddForm()" hidden>Previous</button>
        </form>
    </main>

    
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="/js/students.js"></script>
    <script>
        function showUpdateForm() {
            document.getElementById('email').hidden = true;
            document.getElementById('student-email').required = false;
            document.getElementById('student-id-field').hidden = false;
            document.getElementById('student-id').required = true;
            document.getElementById('add-student-button').hidden = true;
            document.getElementById('update-student-button').hidden = false;
            document.getElementById('next-step-button').hidden = true;
            document.getElementById('previous-step-button').hidden = false;
        }

        function showAddForm() {
            document.getElementById('email').hidden = false;
            document.getElementById('student-email').required = true;
            document.getElementById('student-id-field').hidden = true;
            document.getElementById('student-id').required = false;
            document.getElementById('add-student-button').hidden = false;
            document.getElementById('update-student-button').hidden = true;
            document.getElementById('next-step-button').hidden = false;
            document.getElementById('previous-step-button').hidden = true;
        }
    </script>
</body>
</html>
