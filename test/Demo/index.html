<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debouncing & Throttling</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <form onsubmit="handleFormSubmit(event)" class="form container">

        <h1 class="text-center mt-3">Bookmark Adder</h1>

        <div class="m-3">
            <label for="website-name">Website Name: </label>
            <input class="form-control p-2" id="website-name" type="text" placeholder="website name" required/>

            <label for="website-link">URL: </label>
            <input class="form-control" id="website-link" type="url" placeholder="https://example.com" required/>
        </div>

        <button id="save-bookmark" class="form-control btn btn-primary" type="submit">+ Save bookmark</button>
    </form>

    <div class="">
        <div class="m-2 text-secondary p-2">Saved link: </div>

        <ul id="output">
        </ul>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.20.0/axios.min.js" integrity="sha512-OVq+Gfa9PIjbTC0jWOccSFSp/vzkBQ5pMcbHQrNZLl+izmdFmusmAMlX4LT550ivvSnMXMEeG7CxEtjIz6Dn2Q==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="app.js"></script>
</body>
</html>
