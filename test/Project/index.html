<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Bookmark Adder</title>
    <style>

    </style>
</head>
<body>
    <form onsubmit="handleFormSubmit(event)">
        <div class="container m-4">
            <div class="form-control my-2">
                <label for="web">Website name: </label>
                <input id="web" type="text" class="form-control p-2 my-2 required" />
            </div>

            <div class="form-control my-2">
                <label for="link">URL (link): </label>
                <input id="link" type="url" class="form-control p-2 my-2 required" />
            </div>
        </div>

        <center><button id="bookmark" type="submit">+ Save Bookmark</button></center>
    </form>

    <ul id="output"></ul>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.20.0/axios.min.js" integrity="sha512-OVq+Gfa9PIjbTC0jWOccSFSp/vzkBQ5pMcbHQrNZLl+izmdFmusmAMlX4LT550ivvSnMXMEeG7CxEtjIz6Dn2Q==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="app.js"></script>
</body>
</html>
