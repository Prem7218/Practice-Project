<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Profile</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 32px 16px;
        background: #f3f6fa;
        color: #1f2937;
        font:
          16px/1.5 Arial,
          sans-serif;
      }
      main {
        max-width: 760px;
        margin: 0 auto;
        padding: 32px;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 8px 24px #17255414;
      }
      header {
        display: flex;
        align-items: center;
        gap: 20px;
        padding-bottom: 24px;
        border-bottom: 1px solid #e5e7eb;
      }
      header img {
        width: 112px;
        height: 112px;
        border-radius: 50%;
        object-fit: cover;
        background: #e5e7eb;
      }
      h1,
      h2,
      p {
        margin-top: 0;
      }
      h1 {
        margin-bottom: 4px;
      }
      .muted {
        color: #6b7280;
      }
      section {
        margin-top: 24px;
      }
      dl {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 16px;
        margin: 0;
      }
      dl div {
        padding: 14px;
        background: #f8fafc;
        border-radius: 8px;
      }
      dt {
        color: #6b7280;
        font-size: 0.875rem;
      }
      dd {
        margin: 4px 0 0;
        font-weight: 600;
        overflow-wrap: anywhere;
      }
      .career {
        white-space: pre-wrap;
      }
      @media (max-width: 480px) {
        main {
          padding: 22px;
        }
        header {
          align-items: flex-start;
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <img id="profile-photo" src="/images/profile.jpg" alt="User profile photo" />
        <div>
          <h1 id="profile-name">User Name</h1>
          <p class="muted">
            Born <time id="birth-date" datetime="2000-01-01">January 1, 2000</time> in
            <span id="birthplace">Not provided</span>
          </p>
        </div>
      </header>

      <section aria-labelledby="career-heading">
        <h2 id="career-heading">Career</h2>
        <p id="career" class="career">No career information provided.</p>
      </section>

      <section aria-labelledby="statistics-heading">
        <h2 id="statistics-heading">Statistics</h2>
        <dl>
          <div>
            <dt>Matches</dt>
            <dd id="matches">—</dd>
          </div>
          <div>
            <dt>Score</dt>
            <dd id="score">—</dd>
          </div>
          <div>
            <dt>Fifties</dt>
            <dd id="fifties">—</dd>
          </div>
          <div>
            <dt>Centuries</dt>
            <dd id="centuries">—</dd>
          </div>
          <div>
            <dt>Wickets</dt>
            <dd id="wickets">—</dd>
          </div>
          <div>
            <dt>Average</dt>
            <dd id="average">—</dd>
          </div>
        </dl>
      </section>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.20.0/axios.min.js" integrity="sha512-OVq+Gfa9PIjbTC0jWOccSFSp/vzkBQ5pMcbHQrNZLl+izmdFmusmAMlX4LT550ivvSnMXMEeG7CxEtjIz6Dn2Q==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="../public/js/usersProfile.js"></script>
  </body>
</html>
