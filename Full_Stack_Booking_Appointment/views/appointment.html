<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book an Appointment</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <main class="container py-5">
      <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
          <section class="card border-0 shadow-sm">
            <div class="card-body p-4 p-md-5">
              <h1 class="h3 mb-2">Book an Appointment</h1>
              <p class="text-secondary mb-4">
                Enter your details and preferred appointment time.
              </p>
              <form id="appointment-form">
                <div class="mb-3">
                  <label for="name" class="form-label">Full name</label>
                  <input
                    type="text"
                    class="form-control"
                    id="name"
                    name="name"
                    autocomplete="name"
                    required
                  />
                </div>
                <div class="mb-3">
                  <label for="phone" class="form-label">Phone number</label>
                  <input
                    type="tel"
                    pattern="[0-9]{10,}"
                    minlength="10",
                    title="Phone number must contain at least 10 digits."
                    class="form-control"
                    id="phone"
                    name="phone"
                    autocomplete="tel"
                    required
                  />
                </div>
                <div class="mb-3">
                  <label for="email" class="form-label">Email address</label>
                  <input
                    type="email"
                    class="form-control"
                    id="email"
                    name="email"
                    autocomplete="email"
                    pattern="[a-zA-Z0-9._%+-]+@[a-zA-Z0-9.-]+\.com"
                    title="Enter a valid email address ending with .com"
                    required
                  />
                </div>
                <!-- <div class="row">
                    <div class="col-sm-7 mb-3">
                        <label for="date" class="form-label">Appointment date</label>
                        <input type="date" class="form-control" id="date" name="date" required>
                    </div>
                    <div class="col-sm-5 mb-3">
                        <label for="time" class="form-label">Appointment time</label>
                        <input type="time" class="form-control" id="time" name="time" required>
                    </div>
                </div> -->
                <button
                  id="submitBtn"
                  type="submit"
                  class="btn btn-primary w-100"
                >
                  Submit appointment
                </button>
                <div
                  id="form-message"
                  class="mt-3"
                  role="status"
                  aria-live="polite"
                ></div>
                <ul
                  id="ul"
                  class="list-group mt-3"
                  aria-label="Appointments"
                  style="max-height: 70px; overflow-y: auto"
                ></ul>
              </form>
            </div>
          </section>
        </div>
      </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="/js/appointment.js"></script>
  </body>
</html>
