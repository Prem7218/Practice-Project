<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Store</title>
    <style>
:root {
    --green: #176b50;
    --dark: #123d30;
    --paper: #f4f7f2;
    --white: #fff;
    --muted: #7b8981;
    --line: #e6ece7;
    --shadow: 0 8px 28px rgba(24, 65, 47, .07);
}

* { box-sizing: border-box; }

body {
    margin: 0;
    background: var(--paper);
    color: var(--dark);
    font-family: Inter, system-ui, sans-serif;
}

.page {
    width: min(1120px, calc(100% - 36px));
    margin: auto;
    padding: 48px 0 65px;
}

h1 { font-size: clamp(2.2rem, 5vw, 3.5rem); letter-spacing: -2px; margin: 0 0 10px; }
h2 { font-size: 1.4rem; margin: 0; }
p { margin-top: 0; }
.eyebrow { color: var(--green); font-size: .75rem; font-weight: 800; letter-spacing: 3px; text-transform: uppercase; }
.intro, .section-note { color: var(--muted); }
.intro { margin-bottom: 38px; }
.section-heading { display: flex; justify-content: space-between; align-items: center; gap: 15px; margin-bottom: 18px; }

.book-list {
    display: grid;
    gap: 16px;
    max-height: 610px;
    overflow-y: auto;
    padding: 3px 8px 8px 3px;
    scrollbar-width: thin;
    scrollbar-color: #a8bdb0 transparent;
}

.book-card {
    display: grid;
    grid-template-columns: 145px minmax(0, 1fr) auto;
    align-items: center;
    gap: 22px;
    padding: 18px;
    min-height: 185px;
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: 18px;
    box-shadow: var(--shadow);
    transition: transform .2s, box-shadow .2s;
}

.book-card:hover { transform: translateY(-3px); box-shadow: 0 12px 30px rgba(24,65,47,.12); }

.book-cover {
    display: flex;
    align-items: end;
    min-height: 150px;
    padding: 15px;
    overflow: hidden;
    border-radius: 12px;
    color: white;
    background: linear-gradient(145deg, #173c32, #6b9b7d);
    isolation: isolate;
    position: relative;
}

.book-cover::before, .book-cover::after {
    content: "";
    position: absolute;
    z-index: -1;
    border: 1px solid #ffffff55;
    border-radius: 50%;
}
.book-cover::before { width: 130px; height: 130px; top: -55px; right: -42px; }
.book-cover::after { width: 82px; height: 82px; top: -30px; right: -18px; }

.cover-2 { background: linear-gradient(145deg, #563c35, #c18b60); }
.cover-3 { background: linear-gradient(145deg, #293d5c, #6e91b5); }
.cover-4 { background: linear-gradient(145deg, #554b2c, #bba759); }
.cover-5 { background: linear-gradient(145deg, #49384f, #a27b9f); }
.cover-6 { background: linear-gradient(145deg, #294d4c, #62a29a); }

.cover-title { max-width: 115px; margin: 0; font: bold 1.05rem Georgia, serif; line-height: 1.2; }
.book-info { min-width: 0; }
.book-info h3 { margin: 0 0 5px; font-size: 1.15rem; }
.author { color: var(--muted); font-size: .9rem; margin-bottom: 16px; }

.details { display: grid; grid-template-columns: repeat(4, minmax(80px, 1fr)); gap: 12px; margin: 0; }
.details div { min-width: 0; }
.details dt { color: var(--muted); font-size: .72rem; margin-bottom: 5px; }
.details dd { margin: 0; font-size: .88rem; font-weight: 700; }
.fine { color: #c05d3d; }

.return-button {
    align-self: end;
    padding: 11px 17px;
    border: 0;
    border-radius: 10px;
    background: var(--green);
    color: white;
    font: inherit;
    font-weight: 700;
    cursor: pointer;
    transition: background .2s, transform .2s;
}
.return-button:hover { background: var(--dark); transform: translateY(-2px); }
.return-button:focus-visible { outline: 3px solid #9ac6a9; outline-offset: 3px; }

.returned-section { margin-top: 45px; }

.returned-table-wrap {
    max-height: 390px;
    overflow: auto;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: white;
    box-shadow: var(--shadow);
    scrollbar-width: thin;
    scrollbar-color: #a8bdb0 transparent;
}

table { width: 100%; border-collapse: collapse; text-align: left; }
th, td { padding: 16px 20px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th {
    position: sticky;
    top: 0;
    z-index: 2;
    background: #eaf2ec;
    color: var(--green);
    font-size: .74rem;
    letter-spacing: 1px;
    text-transform: uppercase;
}
td { font-size: .9rem; }
tbody tr:hover { background: #f6faf6; }
tbody tr:last-child td { border-bottom: 0; }

@media (max-width: 760px) {
    .page { width: calc(100% - 28px); padding-top: 30px; }
    .book-card { grid-template-columns: 95px minmax(0, 1fr); gap: 14px; }
    .book-cover { min-height: 130px; padding: 10px; }
    .cover-title { font-size: .9rem; }
    .details { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .return-button { grid-column: 2; justify-self: start; }
}

@media (max-width: 420px) {
    .section-heading { align-items: start; flex-direction: column; }
    .book-card { grid-template-columns: 75px minmax(0, 1fr); padding: 12px; }
    .book-cover { min-height: 115px; }
    .details dd { font-size: .8rem; }
    .return-button { grid-column: 1 / -1; }
}
    </style>
</head>
<body>
    <main class="page">
        <header>
            <p class="eyebrow">Your reading room</p>
            <h1>Library store</h1>
            <p class="intro">Keep track of your borrowed books and return dates.</p>
        </header>

        <section aria-labelledby="borrowed-heading">
            <div class="section-heading">
                <h2 id="borrowed-heading">Currently borrowed</h2>
                <p class="section-note">Scroll to browse all 6 books</p>
            </div>
            <div class="book-list" tabindex="0" aria-label="Borrowed books, scrollable list">
            </div>
        </section>

        <section class="returned-section" aria-labelledby="returned-heading">
            <div class="section-heading">
                <h2 id="returned-heading">Recently returned</h2>
                <p class="section-note">Your returned books</p>
            </div>
            <div class="returned-table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Book name</th>
                            <th>Author</th>
                            <th>Fine</th>
                            <th>Return date</th>
                        </tr>
                    </thead>
                    <tbody id="table-body"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.20.0/axios.min.js" integrity="sha512-OVq+Gfa9PIjbTC0jWOccSFSp/vzkBQ5pMcbHQrNZLl+izmdFmusmAMlX4LT550ivvSnMXMEeG7CxEtjIz6Dn2Q==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="/js/libraryHome.js"></script>
</body>
</html>
